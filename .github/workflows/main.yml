name: docker-compose-actions-workflow

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the stack
        run: docker compose up -d --build

      - name: Check nodejs-server
        run: docker compose ps --services | grep -x nodejs-server

      - name: Check angular-ui
        run: docker compose ps --services | grep -x angular-ui

      - name: Wait for API and UI
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3080/api/users > /dev/null &&
               curl -fsS http://localhost:4201 > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Test containers functionality
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./.github/tests
        env:
          CYPRESS_BASE_URL: http://localhost:3080
          CYPRESS_ANGULAR_URL: http://localhost:4201

      - name: Stop containers
        if: always()
        run: docker compose down
